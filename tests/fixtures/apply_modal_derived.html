  WHAT IT IS DERIVED FROM, which is the whole of the surviving evidence: the

    1 [role=dialog], 43 buttons, one enabled submit named "Submit application",
    zero advance controls.
  * NOT MEASURED -- WHERE ANY OF IT SAT. The counts are page-level. Nobody
    wrote down how the 43 buttons split between the modal and the page chrome,
    nor whether the forms were inside the dialog. This file puts exactly ONE
    button in the dialog (the submit) and the other 42 outside it, because one
    is the most conservative claim available: it asserts no modal chrome that
    was never seen. The forms and the file input are placed in the dialog and
    the reader NEVER LOOKS AT THEM -- dom.read_apply_modal reads dialogs,
    buttons and their attributes and nothing else -- so their placement is
    inert here and is present only so the file answers to the recorded counts.
  * INVENTED OUTRIGHT: the job title, the employer, and every "Page control NN"

  ASCII ONLY. tests/test_apply_modal_fixture.py reads it with encoding="ascii"
