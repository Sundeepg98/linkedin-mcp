<!doctype html>
<!--
  SYNTHETIC. Nothing here was copied from a page.

  It reproduces the ANCHOR STRUCTURE measured on 2026-09-20 in a capture of
  /analytics/creator/content/ -- the counts, the two item-address markers and
  the duplication -- and nothing else. No name, no slug, no member token, no
  real urn. Every digit run is FIVE digits: tests/test_no_committed_identity.py
  matches urn:li:<letters>:<six or more digits>, so a five-digit run cannot
  trip it and is visibly not a LinkedIn id.

  WHAT IT REPRODUCES, and these are the figures scripts/
  _probe_item_addresses_in_capture.py re-derives from a real capture:

      anchors                                            27
      /feed/update/urn:li:share:<digits>/                 4 hrefs, 2 urns
      /analytics/post-summary/urn:li:activity:<digits>/   2 hrefs, 2 urns
      distinct urns                                       4
      no_item_marker refusals                            21

  The 21 non-item anchors are navigation chrome. They are spelled as bare
  section roots (/jobs/, /notifications/) rather than as anybody's profile,
  because a /in/<slug>/ anchor here would be a slug shape in a tracked file
  even if invented.
-->

  <head><title>Content analytics</title></head>
  <body>
