[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
# Scoped to this package on purpose. A bare `error::DeprecationWarning` turns
# every warning any dependency emits into a failure of OUR suite, which is how a
# build ends up red for a reason nobody in this repo can fix; scoping to
# linkedin_server.* means the rule fires on our own deprecated calls only.
filterwarnings =
    error::DeprecationWarning:linkedin_server.*
# pytest-asyncio 1.4.0 is installed in the development environment (verified
# 2026-08-21 with `python -c "import pytest_asyncio"`), and this server is async
# top to bottom, so async tests can be written plain instead of each carrying a
# decorator.
# pytest-asyncio IS declared in requirements.txt and in pyproject.toml's
# `test` extra, because asyncio_mode=auto degrades to an unknown-config
# warning without it -- async tests would then be collected and quietly
# not run on every machine but this one.
asyncio_mode = auto
