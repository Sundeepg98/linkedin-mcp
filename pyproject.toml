[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "MCP server for the operator's own LinkedIn account: fourteen read tools and three gated, confirm-only writes."
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Sundeep" }]
readme = "README.md"
# The fastmcp cap is explained at length in requirements.txt; the short form is
# that its next UNKNOWN major (4.x) is code nobody has run this server against.
# The two files must AGREE -- tests/test_requirements_pins.py compares them
# line by line, because a cap applied to one source of truth and not the other
# protects nothing: requirements.txt is what a developer installs, pyproject
# is what `pip install linkedin-mcp` resolves, and a bound that lands in
# only one of them leaves the other path wide open with nothing afterwards to
# say which of the two paths bit you.
dependencies = ["fastmcp>=2.0,<4", "playwright>=1.40"]

[project.optional-dependencies]
# playwright is NOT an extra here, and that is the one real difference from the
# sibling instahyre server, where it guards a login-only side path and every
# byte of data arrives over plain HTTP. This server has no HTTP data path at
# all: every tool drives a real signed-in Chrome (linkedin_server/browser.py),
# so an install without playwright is an install that cannot answer a single
# call. Making it optional would only move that failure from install time to
# first use, which is the worse place to find it.
#
# pytest-xdist ADDED HERE 2026-09-20 to repair an inherited red, not to
# introduce a dependency. `970a276` added it to requirements.txt so CI shards
# could run their files in parallel, and did not add it here --
# `test_the_two_files_declare_the_same_dependencies` went red at 07:53 and
# every push since has failed on it, on master and on every branch cut from
# master. The guard is right: `pip install -r requirements.txt` and
# `pip install -e .[test]` are two install paths, a package on only one of them
# is present on one and absent on the other, and nothing in the resulting
# ModuleNotFoundError says which path you took.
#
# THE DIRECTION OF THE FIX IS THE ONE requirements.txt ITSELF ARGUES FOR: its
# own comment says "(`pip install -e .[test]` installs the same thing from
# pyproject.toml)", and pytest and pytest-asyncio are already carried in both
# places for exactly that reason. Removing the line from requirements.txt
# instead would agree with the guard and disagree with that sentence, and would
# take the parallel shards with it.
#
# AND THE ABSENCE IS NOT A SLOWDOWN, IT IS A DEAD JOB: ci.yml invokes each
# shard with `-n auto --dist loadfile`, and pytest rejects `-n` as an
# unrecognised argument when the plugin is missing. A venv without it does
# not fall back to a serial run -- it dies at startup, before one test.
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.5"]

[project.scripts]
linkedin-mcp = "linkedin_server.server:main"

[tool.setuptools.packages.find]
include = ["linkedin_server*"]

# pytest configuration lives in pytest.ini (it needs pythonpath=.), deliberately
# not duplicated here -- two sources of truth for test config is how a suite
# quietly stops running the way you think it does.
